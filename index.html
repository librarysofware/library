<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #e9e9e9;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            width: 1000px;
            height: 650px;
            background: white;
            display: flex;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px #999;
        }

        /* IMAGEN */

        .imagen {
            width: 55%;
            height: 100%;
        }

        .imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* LOGIN */

        .login {
            width: 45%;
            padding: 100px 70px;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 55px;
        }

        input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #777;
            padding: 15px 0;
            margin-bottom: 30px;
            font-size: 17px;
            outline: none;
        }

        .password {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #777;
            margin-bottom: 50px;
        }

        .password input {
            border: none;
            margin: 0;
        }

        .forgot {
            color: #07195c;
            font-size: 14px;
            white-space: nowrap;
        }

        button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            background: #07195c;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #0c267d;
        }

        p {
            text-align: center;
            margin-top: 80px;
            font-size: 15px;
        }

        a {
            color: #07195c;
            font-weight: bold;
            text-decoration: none;
        }
    </style>

</head>

<body>

    <div class="contenedor">

        <div class="imagen">

            <img src="https://i.pinimg.com/1200x/6f/40/7d/6f407d86090cd2857036ac6f1b4941c2.jpg" alt="Paisaje">

        </div>


        <div class="login">

            <h1>Login</h1>
            <form action="pagina.html?vscode-livepreview=true" method="GET">
                
                <input type="email" placeholder="Email">

                <div class="password">

                    <input type="password" placeholder="Password">

                    <a href="#" class="forgot">
                        Forgot password?
                    </a>

                </div>
                <!-- BOTÓN QUE LLEVA A PRINCIPAL.HTML -->
    
                <button ">
                    Login
                </button>
            </form>





            <p>
                Don't have an account?

                <a href="pagina.html?vscode-livepreview=true">
                    Sign up
                </a>
            </p>

        </div>

    </div>

</body>

</html>
